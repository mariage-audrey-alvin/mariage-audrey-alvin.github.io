<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livre d'Or audio - Audrey & Alvin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdfbf7; 
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-card {
            width: 100%;
            max-width: 480px;
            background-color: #f09f90;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(240, 159, 144, 0.3); 
            border: none;
        }

        .cover-section {
            position: relative;
            width: 100%;
            height: auto;
            overflow: hidden;
        }

        .cover-image {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .cover-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, #f09f90 0%, rgba(240, 159, 144, 0.3) 60%, rgba(0,0,0,0) 100%);
        }

        .cover-content {
            position: absolute;
            bottom: 25px;
            left: 25px;
            right: 25px;
            z-index: 2;
        }

        .wedding-date {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .wedding-names {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            font-style: italic;
            font-weight: 400;
            color: #ffffff; 
            margin: 0;
            line-height: 1.2;
        }

        .book-section {
            padding: 25px;
        }

        .separator {
            width: 60%;
            height: 1px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 100%);
            margin: 0 auto 20px auto;
        }

        .instructions {
            text-align: center;
            font-size: 15px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #ffffff; 
            margin-bottom: 20px;
            line-height: 1.6;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }


        .guest-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            color: #333333;
            text-align: center;
        }

        .guest-photo-wrapper {
            width: 100%;
            max-height: 320px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
            background-color: #f9f9f9;
        }

        .guest-photo {
            width: 100%;
            height: 100%;
            max-height: 320px;
            object-fit: cover;
            display: block;
        }

        .guest-name {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #2c3e50;
            margin: 10px 0 15px 0;
            font-weight: 700;
        }


        audio {
            width: 100%;
            height: 40px;
            border-radius: 20px;
            margin-bottom: 15px;
            outline: none;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            gap: 12px;
        }

        .btn-nav {
            flex: 1;
            padding: 12px 18px;
            border: none;
            background-color: #ffffff;
            color: #f09f90;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .btn-nav:hover:not(:disabled) {
            background-color: #fff4f2;
            transform: translateY(-1px);
        }

        .btn-nav:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .page-counter {
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 15px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="phone-card">

        <div class="cover-section">
            <img src="AA2.jpg" alt="Audrey & Alvin" class="cover-image">
            <div class="cover-overlay"></div>
            <div class="cover-content">
                <div class="wedding-date">18 juillet 2026</div>
                <div class="wedding-names">Audrey & Alvin</div>
            </div>
        </div>

        <div class="book-section">
            <div class="separator"></div>
            
            <div class="instructions">
                Le Livre d'Or Audio ✨
            </div>

            <div class="guest-card">
                <div class="guest-photo-wrapper">
                    <img id="guest-photo" class="guest-photo" src="" alt="Photo du message">
                </div>
                
                <div id="guest-name" class="guest-name">---</div>

                <audio id="guest-audio" controls preload="metadata">
                    <source id="audio-source" src="" type="audio/mpeg">
                    Votre navigateur ne prend pas en charge l'élément audio.
                </audio>
            </div>

            <div class="nav-controls">
                <button id="btn-prev" class="btn-nav" onclick="changePage(-1)">← Précédent</button>
                <button id="btn-next" class="btn-nav" onclick="changePage(1)">Suivant →</button>
            </div>

            <div id="page-counter" class="page-counter">Passage 1 sur 1</div>

            <a href="index.html" class="back-link">← Laissez un message à votre tour</a>
        </div>
    </div>

    <script>

        const guestMessages = [
            {
                name: "Lore, Clara & Aurélien",
                photo: "Media/Lore_Clara_Ms_Bean.png",
                audio: "Media/Lore_Clara_Ms_Bean.mp4"
            },
            
            {
                name: "Adrien Pater",
                photo: "Media/Adrien_Pater.png",
                audio: "Media/Adrien_Pater.mp4"
            },

            {
                name: "Luka & Manon",
                photo: "Media/Luka_et_Manon_Mandel.png",
                audio: "Media/Luka_et_Manon_Mandel.mp4"
            },

            {
                name: "Tony & Katy",
                photo: "Media/Tony_et_Katy_Mansel.png",
                audio: "Media/Tony_et_Katy_Mansel.mp4"
            },

            {
                name: "Kévin & Sonny",
                photo: "Media/Kévin_et_Sonny_Vangrootenbruele.png",
                audio: "Media/Kévin_et_Sonny_Vangrootenbruele.m4a"
            },

            {
                name: "Nouille Coget 1",
                photo: "Media/Nouille_Coget_1.png",
                audio: "Media/Nouille_Coget_1.mp4"
            },

            {
                name: "Benjamin & Perrine",
                photo: "Media/Benjamin_Perrine.png",
                audio: "Media/Benjamin_Perrine.mp4"
            },

            {
                name: "Baptiste Baron",
                photo: "Media/Baptiste_Baron.png",
                audio: "Media/Baptiste_Baron.mp4"
            },

            {
                name: "Nouille Coget 2",
                photo: "Media/Nouille_Coget_2.png",
                audio: "Media/Nouille_Coget_2.mp4"
            },

            {
                name: "Emilie",
                photo: "Media/Emilie_bonhote.png",
                audio: "Media/Emilie_bonhote.mp4"
            },

            {
                name: "Table Lilas du Crépuscule",
                photo: "Media/Table_Lilas_du_crépuscule.jpg",
                audio: ""
            },

            {
                name: "Emma",
                photo: "Media/Emma_Jodin_1.jpeg",
                photo: "Media/Emma_Jodin_2.jpeg",
                photo: "Media/Emma_Jodin_3.jpeg",
                photo: "Media/Emma_Jodin_4.jpeg",
                audio: "Emma_Jodin.mp4"
            },
            
            {
                name: "Kassandre Lesien",
                photo: "Media/Kassandre_Lesien.png",
                audio: "Media/Kassandre_Lesien.mp4"
            },

            {
                name: "Clara & Aurélien",
                photo: "Media/Clara_Ms_Bean.png",
                audio: "Media/Clara_Ms_Bean.mp4"
            },

            {
                name: "Gros dodo de Romy",
                photo: "Media/Dodo_romy.png",
                audio: "Media/Dodo_romy.mp4"
            }
        ];

        let currentIndex = 0;

        function updateCard(index) {
            const data = guestMessages[index];
            
            document.getElementById('guest-photo').src = data.photo;
            document.getElementById('guest-name').textContent = data.name;

            const audioEl = document.getElementById('guest-audio');
            const sourceEl = document.getElementById('audio-source');
            sourceEl.src = data.audio;
            audioEl.load();

            document.getElementById('page-counter').textContent = `Passage ${index + 1} sur ${guestMessages.length}`;

            document.getElementById('btn-prev').disabled = (index === 0);
            document.getElementById('btn-next').disabled = (index === guestMessages.length - 1);
        }

        function changePage(step) {
            currentIndex += step;
            updateCard(currentIndex);
        }

        updateCard(0);
    </script>

</body>
</html>
