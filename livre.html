<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livre d'Or audio - Audrey & Alvin</title>
  <style>
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px 0;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(235,165,150,1) 0%, rgba(245,190,175,1) 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .header-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .card {
      background: white;
      margin: -20px 15px 20px 15px;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      position: relative;
    }

    .guest-photo {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .guest-name {
      font-size: 1.4em;
      color: #333;
      margin: 10px 0 5px 0;
      font-weight: bold;
    }

    audio {
      width: 100%;
      margin: 15px 0;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px 15px;
      border: none;
      background-color: #5d6d7e;
      color: white;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #34495e;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .counter {
      font-size: 0.85em;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="AA2.jpg" alt="Audrey & Alvin" class="header-img">

    <div class="card">
      <h2 style="margin-top:0; color:#444;">Le Livre d'Or 💬</h2>

      <img id="photo-invite" class="guest-photo" src="" alt="Photo de l'invité">
      <div id="nom-invite" class="guest-name">---</div>

      <audio id="audio-invite" controls>
        <source id="audio-source" src="" type="audio/mpeg">
        Votre navigateur ne supporte pas le lecteur audio.
      </audio>

      <div class="nav-buttons">
        <button id="btn-prev" onclick="changerPage(-1)">← Précédent</button>
        <button id="btn-next" onclick="changerPage(1)">Suivant →</button>
      </div>

      <div class="counter" id="compteur">Page 1</div>
    </div>
  </div>

  <script>
    const passages = [
      {
        nom: "Marie & Thomas",
        photo: "media/photo1.jpg",
        audio: "media/audio1.mp3"
      },
      {
        nom: "Lucas",
        photo: "media/photo2.jpg",
        audio: "media/audio2.mp3"
      }
    ];

    let currentIndex = 0;

    function afficherPassage(index) {
      const p = passages[index];
      
      document.getElementById('photo-invite').src = p.photo;
      document.getElementById('nom-invite').innerText = p.nom;
      
      const audioEl = document.getElementById('audio-invite');
      document.getElementById('audio-source').src = p.audio;
      audioEl.load();

      document.getElementById('compteur').innerText = `Message ${index + 1} sur ${passages.length}`;

      document.getElementById('btn-prev').disabled = (index === 0);
      document.getElementById('btn-next').disabled = (index === passages.length - 1);
    }

    function changerPage(direction) {
      currentIndex += direction;
      afficherPassage(currentIndex);
    }

    afficherPassage(0);
  </script>

</body>
</html>
